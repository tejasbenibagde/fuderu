<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuderu - Brush Test</title>

  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #222;
      padding: 20px;
      border-radius: 12px;
    }

    canvas {
      background: white;
      border-radius: 8px;
      display: block;
      margin-bottom: 10px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    .active {
      background: red;
      color: white;
    }
  </style>
</head>

<body>
<div class="container">

  <canvas id="canvas" width="800" height="500"></canvas>

  <div class="toolbar">
    <button id="drawBtn" class="active">Draw</button>
    <button id="eraseBtn">Erase</button>
    <button id="clearBtn">Clear</button>

    <button id="dipPenBtn" class="active">Dip Pen</button>
    <button id="airbrushBtn">Airbrush</button>

    <input type="color" id="colorPicker" value="#000000">

    Size <input type="range" id="size" min="1" max="50" value="10">
    Opacity <input type="range" id="opacity" min="0" max="1" step="0.01" value="1">
    Smooth <input type="range" id="smooth" min="0" max="1" step="0.01" value="0.5">

    <span id="status">Loading...</span>
  </div>

</div>

<script type="module">
import Fuderu from './src/index.ts';

let painter = null;
let ready = false;

const status = document.getElementById('status');
const drawBtn = document.getElementById('drawBtn');
const eraseBtn = document.getElementById('eraseBtn');
const clearBtn = document.getElementById('clearBtn');
const dipPenBtn = document.getElementById('dipPenBtn');
const airbrushBtn = document.getElementById('airbrushBtn');
const colorPicker = document.getElementById('colorPicker');
const size = document.getElementById('size');
const opacity = document.getElementById('opacity');
const smooth = document.getElementById('smooth');

async function init() {
  painter = new Fuderu({
    canvas: '#canvas',
    color: '#000',
    size: 10,
    opacity: 1
  });

  // 🔥 wait until WASM is actually ready
  const waitReady = () => {
    if (painter.wasmReady) {
      ready = true;
      if (status) {
        status.textContent = 'Ready';
        status.style.color = 'lime';
      }
    } else {
      requestAnimationFrame(waitReady);
    }
  };

  waitReady();
}

document.addEventListener('DOMContentLoaded', init);

function safe(fn) {
  if (!ready || !painter) return;
  fn(painter);
}

// 🔹 modes
if (drawBtn && eraseBtn) {
  drawBtn.onclick = () => {
    safe(p => p.setInvert(false));
    drawBtn.classList.add('active');
    eraseBtn.classList.remove('active');
  };

  eraseBtn.onclick = () => {
    safe(p => p.setInvert(true));
    eraseBtn.classList.add('active');
    drawBtn.classList.remove('active');
  };
}

// 🔹 clear
if (clearBtn) {
  clearBtn.onclick = () => safe(p => p.clear());
}

// 🔹 brushes
if (dipPenBtn && airbrushBtn) {
  dipPenBtn.onclick = () => {
    safe(p => p.useBrush('dip-pen-soft'));
    dipPenBtn.classList.add('active');
    airbrushBtn.classList.remove('active');
  };

  airbrushBtn.onclick = () => {
    safe(p => p.useBrush('airbrush-normal'));
    airbrushBtn.classList.add('active');
    dipPenBtn.classList.remove('active');
  };
}

// 🔹 controls
if (colorPicker) {
  colorPicker.oninput = e =>
    safe(p => p.setColor(e.target.value));
}

if (size) {
  size.oninput = e =>
    safe(p => p.setSize(+e.target.value));
}

if (opacity) {
  opacity.oninput = e =>
    safe(p => p.setOpacity(+e.target.value));
}

if (smooth) {
  smooth.oninput = e => {
    safe(p => {
      p.setSmoothing(+e.target.value);
    });
  };
}

</script>
</body>
</html>
