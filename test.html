<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuderu - Brush Test</title>

  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #222;
      padding: 20px;
      border-radius: 12px;
    }

    canvas {
      background: white;
      border-radius: 8px;
      display: block;
      margin-bottom: 10px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    .active {
      background: red;
      color: white;
    }
  </style>
</head>

<body>
<div class="container">

  <canvas id="canvas" width="800" height="500"></canvas>

  <div class="toolbar">
    <button id="drawBtn" class="active">Draw</button>
    <button id="eraseBtn">Erase</button>
    <button id="clearBtn">Clear</button>

    <button id="dipPenBtn" class="active">Dip Pen</button>
    <button id="airbrushBtn">Airbrush</button>

    <input type="color" id="colorPicker" value="#000000">

    Size <input type="range" id="size" min="1" max="50" value="10">
    Opacity <input type="range" id="opacity" min="0" max="1" step="0.01" value="1">
    Smooth <input type="range" id="smooth" min="0" max="1" step="0.01" value="0.5">

    <span id="status">Loading...</span>
  </div>

</div>

<script type="module">
import Fuderu from './src/index.ts';

let painter = null;
let ready = false;

const status = document.getElementById('status');

async function init() {
  painter = new Fuderu({
    canvas: '#canvas',
    color: '#000',
    size: 10,
    opacity: 1
  });

  // 🔥 wait until WASM is actually ready
  const waitReady = () => {
    if (painter.wasmReady) {
      ready = true;
      status.textContent = 'Ready';
      status.style.color = 'lime';
    } else {
      requestAnimationFrame(waitReady);
    }
  };

  waitReady();
}

document.addEventListener('DOMContentLoaded', init);

function safe(fn) {
  if (!ready || !painter) return;
  fn(painter);
}

// 🔹 modes
drawBtn.onclick = () => {
  safe(p => p.setInvert(false));
  drawBtn.classList.add('active');
  eraseBtn.classList.remove('active');
};

eraseBtn.onclick = () => {
  safe(p => p.setInvert(true));
  eraseBtn.classList.add('active');
  drawBtn.classList.remove('active');
};

// 🔹 clear
clearBtn.onclick = () => safe(p => p.clear());

// 🔹 brushes
dipPenBtn.onclick = () => {
  safe(p => p.useBrush('dip-pen-soft'));
  dipPenBtn.classList.add('active');
  airbrushBtn.classList.remove('active');
};

airbrushBtn.onclick = () => {
  safe(p => p.useBrush('airbrush-normal'));
  airbrushBtn.classList.add('active');
  dipPenBtn.classList.remove('active');
};

// 🔹 controls
colorPicker.oninput = e =>
  safe(p => p.setColor(e.target.value));

size.oninput = e =>
  safe(p => p.setSize(+e.target.value));

opacity.oninput = e =>
  safe(p => p.setOpacity(+e.target.value));

// 🔥 IMPORTANT FIX
smooth.oninput = e => {
  safe(p => {
    p.setSmoothing(+e.target.value);

    // 💥 CRITICAL: reset stroke to avoid freeze
    p.brushEngine?.endStroke?.();
  });
};

</script>
</body>
</html>
