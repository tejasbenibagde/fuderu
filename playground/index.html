<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fuderu - Brush Presets Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #0f3460;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            margin: 0 auto;
            cursor: crosshair;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            touch-action: none;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        button {
            background: #1a5276;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            background: #e94560;
            transform: translateY(-2px);
        }

        button.active {
            background: #e94560;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .preset-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            background: #0a1a2e;
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .preset-btn {
            background: #0f3460;
            padding: 6px 12px;
            font-size: 12px;
        }

        .preset-btn:hover {
            background: #e94560;
        }

        .preset-title {
            color: white;
            font-size: 12px;
            font-weight: 500;
            margin-right: 8px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a5276;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .control-group label {
            color: white;
            font-size: 12px;
            font-weight: 500;
        }

        input {
            padding: 6px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        input[type="range"] {
            width: 150px;
            cursor: pointer;
        }

        .value-display {
            color: white;
            font-size: 12px;
            background: #0f3460;
            padding: 4px 8px;
            border-radius: 4px;
            min-width: 45px;
            text-align: center;
        }

        .status {
            color: #4c9aff;
            font-size: 12px;
            margin-left: auto;
            padding: 4px 12px;
            background: #1a5276;
            border-radius: 20px;
        }

        .info {
            margin-top: 12px;
            padding: 10px;
            background: #1a5276;
            border-radius: 8px;
            font-size: 12px;
            color: white;
            text-align: center;
        }

        .info span {
            color: #e94560;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <canvas id="canvas"></canvas>

        <!-- Preset Buttons -->
        <div class="preset-group">
            <span class="preset-title">🎨 Presets:</span>
            <button class="preset-btn" data-preset="pencil">✏️ Pencil</button>
            <button class="preset-btn" data-preset="marker">🖍️ Marker</button>
            <button class="preset-btn" data-preset="watercolor">💧 Watercolor</button>
            <button class="preset-btn" data-preset="airbrush">🎨 Airbrush</button>
            <button class="preset-btn" data-preset="charcoal">⚫ Charcoal</button>
            <button class="preset-btn" data-preset="calligraphy">✒️ Calligraphy</button>
        </div>

        <div class="toolbar">
            <button id="clearBtn">🧹 Clear</button>
            <button id="eraserBtn">✏️ Draw</button>

            <div class="control-group">
                <label>🎨 Color:</label>
                <input type="color" id="colorPicker" value="#000000">
            </div>

            <div class="control-group">
                <label>📏 Brush Size:</label>
                <input type="range" id="sizeSlider" min="1" max="50" value="5">
                <span id="sizeValue" class="value-display">5px</span>
            </div>

            <div class="control-group">
                <label>🔄 Lazy Radius:</label>
                <input type="range" id="radiusSlider" min="0" max="100" value="30">
                <span id="radiusValue" class="value-display">30px</span>
            </div>

            <div class="control-group">
                <label>⚡ Friction:</label>
                <input type="range" id="frictionSlider" min="0" max="0.9" step="0.01" value="0">
                <span id="frictionValue" class="value-display">0%</span>
            </div>

            <div class="control-group">
                <label>🎯 Opacity:</label>
                <input type="range" id="opacitySlider" min="0" max="1" step="0.01" value="1">
                <span id="opacityValue" class="value-display">100%</span>
            </div>

            <div class="control-group">
                <label>📍 Spacing Min:</label>
                <input type="range" id="spacingMinSlider" min="0.1" max="10" step="0.1" value="0.5">
                <span id="spacingMinValue" class="value-display">0.5</span>
            </div>

            <div class="control-group">
                <label>📏 Spacing Max:</label>
                <input type="range" id="spacingMaxSlider" min="1" max="30" step="0.1" value="12">
                <span id="spacingMaxValue" class="value-display">12</span>
            </div>

            <div class="control-group">
                <label>⚙️ Spacing Mult:</label>
                <input type="range" id="spacingMultiplierSlider" min="0.01" max="1" step="0.01" value="0.18">
                <span id="spacingMultiplierValue" class="value-display">0.18</span>
            </div>

            <div class="control-group">
                <label>🎚️ Density Curve:</label>
                <input type="range" id="densityCurveSlider" min="0.01" max="5" step="0.01" value="0.5">
                <span id="densityCurveValue" class="value-display">0.5</span>
            </div>

            <div class="control-group">
                <label>✨ Opacity Curve:</label>
                <input type="range" id="opacityCurveSlider" min="0.01" max="5" step="0.01" value="1.5">
                <span id="opacityCurveValue" class="value-display">1.5</span>
            </div>

            <div class="control-group">
                <label>🧠 Density Fix:</label>
                <input type="checkbox" id="densityCompensationToggle" checked>
            </div>

            <div class="status" id="status">Ready</div>
        </div>

        <div class="info">
            💡 <span>Brush Presets</span> - Click any preset to instantly change brush behavior!<br>
            🎨 Each preset has unique <span>Size, Radius, Friction, and Spacing</span> settings.<br>
            Try <span>Pencil</span> for precise lines, <span>Watercolor</span> for smooth blending, or
            <span>Airbrush</span> for soft spray!
        </div>
    </div>

    <script type="module">
        import { Canvas } from '../src/canvas.ts';

        // =========================
        // Canvas Instance
        // =========================

        const painter = new Canvas({
            canvas: '#canvas',
            color: '#000000',
            size: 5,
            radius: 30,
            friction: 0,
            opacity: 1,
            eraser: false
        });

        // =========================
        // UI Elements
        // =========================

        const clearBtn = document.getElementById('clearBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const presetBtns = document.querySelectorAll('.preset-btn');

        const colorPicker = document.getElementById('colorPicker');

        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');

        const radiusSlider = document.getElementById('radiusSlider');
        const radiusValue = document.getElementById('radiusValue');

        const frictionSlider = document.getElementById('frictionSlider');
        const frictionValue = document.getElementById('frictionValue');

        const opacitySlider = document.getElementById('opacitySlider');
        const opacityValue = document.getElementById('opacityValue');

        const statusDiv = document.getElementById('status');

        const spacingMinSlider =
            document.getElementById('spacingMinSlider');

        const spacingMinValue =
            document.getElementById('spacingMinValue');

        const spacingMaxSlider =
            document.getElementById('spacingMaxSlider');

        const spacingMaxValue =
            document.getElementById('spacingMaxValue');

        const spacingMultiplierSlider =
            document.getElementById('spacingMultiplierSlider');

        const spacingMultiplierValue =
            document.getElementById('spacingMultiplierValue');

        const densityCurveSlider =
            document.getElementById('densityCurveSlider');

        const densityCurveValue =
            document.getElementById('densityCurveValue');

        const opacityCurveSlider =
            document.getElementById('opacityCurveSlider');

        const opacityCurveValue =
            document.getElementById('opacityCurveValue');

        const densityCompensationToggle =
            document.getElementById('densityCompensationToggle');

        // =========================
        // Initial Canvas Size
        // =========================

        const canvas = document.getElementById('canvas');

        canvas.style.width = '800px';
        canvas.style.height = '500px';

        painter.resize();
        updateEngineControls();

        // =========================
        // Apply Preset Function
        // =========================

        function applyPreset(preset) {
            painter.applyPreset(preset);

            // Update UI sliders to reflect preset values
            sizeSlider.value = painter.getSize();
            sizeValue.textContent = `${painter.getSize()}px`;

            radiusSlider.value = painter.getRadius();
            radiusValue.textContent = `${painter.getRadius()}px`;

            frictionSlider.value = painter.getFriction();
            frictionValue.textContent = `${Math.round(painter.getFriction() * 100)}%`;

            statusDiv.textContent = `🎨 Preset: ${preset.toUpperCase()} applied!`;

            // Reset eraser button state if needed
            if (painter.isErasing()) {
                painter.disableEraser();
                eraserBtn.textContent = '✏️ Draw';
                eraserBtn.classList.remove('active');
            }

            updateEngineControls();
        }

        function updateEngineControls() {
            const config =
                painter.getBrushEngineConfig();

            spacingMinSlider.value =
                config.spacingMin;

            spacingMinValue.textContent =
                config.spacingMin;

            spacingMaxSlider.value =
                config.spacingMax;

            spacingMaxValue.textContent =
                config.spacingMax;

            spacingMultiplierSlider.value =
                config.spacingMultiplier;

            spacingMultiplierValue.textContent =
                config.spacingMultiplier;

            densityCurveSlider.value =
                config.densityCurve;

            densityCurveValue.textContent =
                config.densityCurve;

            opacityCurveSlider.value =
                config.opacityCurve;

            opacityCurveValue.textContent =
                config.opacityCurve;

            densityCompensationToggle.checked =
                config.densityCompensation;
        }

        // =========================
        // Actions
        // =========================

        function clearCanvas() {
            painter.clear();
            statusDiv.textContent = 'Canvas cleared';
        }

        function toggleEraser() {
            painter.toggleEraser();

            if (painter.isErasing()) {
                eraserBtn.textContent = '🗑️ Eraser';
                eraserBtn.classList.add('active');
                statusDiv.textContent = 'Eraser Mode - Click Draw to go back';
            } else {
                eraserBtn.textContent = '✏️ Draw';
                eraserBtn.classList.remove('active');
                statusDiv.textContent = 'Drawing Mode';
            }
        }

        // =========================
        // Update UI from Controls
        // =========================

        function updateSize() {
            const size = Number(sizeSlider.value);
            painter.setSize(size);
            sizeValue.textContent = `${size}px`;
            statusDiv.textContent = `Brush Size: ${size}px`;
        }

        function updateRadius() {
            const radius = Number(radiusSlider.value);
            painter.setRadius(radius);
            radiusValue.textContent = `${radius}px`;
            statusDiv.textContent = `Lazy Radius: ${radius}px`;
        }

        function updateFriction() {
            const friction = Number(frictionSlider.value);
            painter.setFriction(friction);
            frictionValue.textContent = `${Math.round(friction * 100)}%`;
            statusDiv.textContent = `Friction: ${Math.round(friction * 100)}%`;
        }

        function updateOpacity() {
            const opacity = Number(opacitySlider.value);
            painter.setOpacity(opacity);
            opacityValue.textContent = `${Math.round(opacity * 100)}%`;
            statusDiv.textContent = `Opacity: ${Math.round(opacity * 100)}%`;
        }

        function updateColor() {
            painter.setColor(colorPicker.value);
            statusDiv.textContent = `Color: ${colorPicker.value}`;
        }

        function updateSpacingMin() {
            const value =
                Number(spacingMinSlider.value);

            painter.configureBrushEngine({
                spacingMin: value
            });

            spacingMinValue.textContent =
                value.toFixed(1);

            statusDiv.textContent =
                `Spacing Min: ${value}`;
        }

        function updateSpacingMax() {
            const value =
                Number(spacingMaxSlider.value);

            painter.configureBrushEngine({
                spacingMax: value
            });

            spacingMaxValue.textContent =
                value.toFixed(1);

            statusDiv.textContent =
                `Spacing Max: ${value}`;
        }

        function updateSpacingMultiplier() {
            const value =
                Number(spacingMultiplierSlider.value);

            painter.configureBrushEngine({
                spacingMultiplier: value
            });

            spacingMultiplierValue.textContent =
                value.toFixed(2);

            statusDiv.textContent =
                `Spacing Multiplier: ${value}`;
        }

        function updateDensityCurve() {
            const value =
                Number(densityCurveSlider.value);

            painter.configureBrushEngine({
                densityCurve: value
            });

            densityCurveValue.textContent =
                value.toFixed(2);

            statusDiv.textContent =
                `Density Curve: ${value}`;
        }

        function updateOpacityCurve() {
            const value =
                Number(opacityCurveSlider.value);

            painter.configureBrushEngine({
                opacityCurve: value
            });

            opacityCurveValue.textContent =
                value.toFixed(2);

            statusDiv.textContent =
                `Opacity Curve: ${value}`;
        }

        function updateDensityCompensation() {
            const value =
                densityCompensationToggle.checked;

            painter.configureBrushEngine({
                densityCompensation: value
            });

            statusDiv.textContent =
                `Density Compensation: ${value}`;
        }

        // =========================
        // Events
        // =========================

        clearBtn.addEventListener('click', clearCanvas);
        eraserBtn.addEventListener('click', toggleEraser);

        // Preset buttons
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const preset = btn.dataset.preset;
                applyPreset(preset);
            });
        });

        colorPicker.addEventListener('input', updateColor);
        sizeSlider.addEventListener('input', updateSize);
        radiusSlider.addEventListener('input', updateRadius);
        frictionSlider.addEventListener('input', updateFriction);
        opacitySlider.addEventListener('input', updateOpacity);

        spacingMinSlider.addEventListener(
            'input',
            updateSpacingMin
        );

        spacingMaxSlider.addEventListener(
            'input',
            updateSpacingMax
        );

        spacingMultiplierSlider.addEventListener(
            'input',
            updateSpacingMultiplier
        );

        densityCurveSlider.addEventListener(
            'input',
            updateDensityCurve
        );

        opacityCurveSlider.addEventListener(
            'input',
            updateOpacityCurve
        );

        densityCompensationToggle.addEventListener(
            'change',
            updateDensityCompensation
        );

        // =========================
        // Ready
        // =========================

        console.log('Fuderu Canvas Ready with Presets!');
        console.log('Available presets: pencil, marker, watercolor, airbrush, charcoal, calligraphy');
    </script>
</body>

</html>
