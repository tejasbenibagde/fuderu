<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <title>Fuderu - New Brush Engine Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            background: #0f172a;
            border-radius: 20px;
            padding: 20px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.4);
        }

        canvas {
            width: 100%;
            height: 700px;
            display: block;
            background: white;
            border-radius: 14px;
            cursor: crosshair;
            touch-action: none;
        }

        .toolbar {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 12px;
        }

        .group label {
            color: white;
            font-size: 13px;
            font-weight: 600;
        }

        .group input[type="range"] {
            width: 140px;
        }

        .value {
            min-width: 48px;
            text-align: center;
            color: #93c5fd;
            font-size: 12px;
            font-weight: 700;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            background: #3b82f6;
        }

        button.active {
            background: #ef4444;
        }

        .status {
            margin-left: auto;
            color: #93c5fd;
            background: #1e293b;
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .info {
            margin-top: 16px;
            background: #1e293b;
            padding: 14px;
            border-radius: 14px;
            color: white;
            font-size: 13px;
            line-height: 1.6;
        }

        .info span {
            color: #60a5fa;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="container">

        <canvas id="canvas"></canvas>

        <div class="toolbar">

            <button id="clearBtn">
                🧹 Clear
            </button>

            <button id="undoBtn">
                ↩️ Undo
            </button>

            <button id="redoBtn">
                ↪️ Redo
            </button>

            <div class="group">
                <label>🎨 Color</label>

                <input
                    type="color"
                    id="colorPicker"
                    value="#000000" />
            </div>

            <div class="group">
                <label>📏 Size</label>

                <input
                    type="range"
                    id="sizeSlider"
                    min="1"
                    max="120"
                    value="20" />

                <span
                    class="value"
                    id="sizeValue">
                    20
                </span>
            </div>

            <div class="group">
                <label>✨ Opacity</label>

                <input
                    type="range"
                    id="opacitySlider"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1" />

                <span
                    class="value"
                    id="opacityValue">
                    100%
                </span>
            </div>

            <div class="group">
                <label>💧 Flow</label>

                <input
                    type="range"
                    id="flowSlider"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1" />

                <span
                    class="value"
                    id="flowValue">
                    100%
                </span>
            </div>

            <div class="group">
                <label>🌀 Spacing</label>

                <input
                    type="range"
                    id="spacingSlider"
                    min="0.1"
                    max="5"
                    step="0.1"
                    value="0.5" />

                <span
                    class="value"
                    id="spacingValue">
                    0.5
                </span>
            </div>

            <div class="group">
                <label>✒️ Roundness</label>

                <input
                    type="range"
                    id="roundnessSlider"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1" />

                <span
                    class="value"
                    id="roundnessValue">
                    1
                </span>
            </div>

            <div class="group">
                <label>🔄 Angle</label>

                <input
                    type="range"
                    id="angleSlider"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0" />

                <span
                    class="value"
                    id="angleValue">
                    0
                </span>
            </div>

            <div class="group">
                <label>🧠 Smooth</label>

                <input
                    type="checkbox"
                    id="smoothToggle"
                    checked />
            </div>

            <div class="group">
                <label>📍 Spacing</label>

                <input
                    type="checkbox"
                    id="spacingToggle"
                    checked />
            </div>

            <div
                class="status"
                id="status">
                Ready
            </div>

        </div>

        <div class="info">
            <span>Fuderu New Engine</span><br />

            • Bezier interpolation system<br />
            • Pressure-sensitive point engine<br />
            • Brush image support<br />
            • Undo / Redo system<br />
            • Module-based architecture<br />
            • Real-time rendering queue
        </div>

    </div>

    <script type="module">

        import { Canvas } from '../src/canvas.ts';

        // ========================================
        // Canvas
        // ========================================

        const painter = new Canvas({
            canvas: '#canvas',
            brush: {
                size: 20,
                opacity: 1,
                flow: 1,
                color: '#000000',
                angle: 0,
                roundness: 1,
                spacing: 0.5
            }
        });

        // ========================================
        // Elements
        // ========================================

        const clearBtn =
            document.getElementById('clearBtn');

        const undoBtn =
            document.getElementById('undoBtn');

        const redoBtn =
            document.getElementById('redoBtn');

        const colorPicker =
            document.getElementById('colorPicker');

        const sizeSlider =
            document.getElementById('sizeSlider');

        const opacitySlider =
            document.getElementById('opacitySlider');

        const flowSlider =
            document.getElementById('flowSlider');

        const spacingSlider =
            document.getElementById('spacingSlider');

        const roundnessSlider =
            document.getElementById('roundnessSlider');

        const angleSlider =
            document.getElementById('angleSlider');

        const smoothToggle =
            document.getElementById('smoothToggle');

        const spacingToggle =
            document.getElementById('spacingToggle');

        const status =
            document.getElementById('status');

        // Values

        const sizeValue =
            document.getElementById('sizeValue');

        const opacityValue =
            document.getElementById('opacityValue');

        const flowValue =
            document.getElementById('flowValue');

        const spacingValue =
            document.getElementById('spacingValue');

        const roundnessValue =
            document.getElementById('roundnessValue');

        const angleValue =
            document.getElementById('angleValue');

        // ========================================
        // Update Config
        // ========================================

        function updateConfig() {

            const config = {
                size:
                    Number(sizeSlider.value),

                opacity:
                    Number(opacitySlider.value),

                flow:
                    Number(flowSlider.value),

                color:
                    colorPicker.value,

                spacing:
                    Number(spacingSlider.value),

                roundness:
                    Number(roundnessSlider.value),

                angle:
                    Number(angleSlider.value)
            };

            painter.loadConfig(config);

            painter.setSmooth(
                smoothToggle.checked
            );

            painter.setSpacing(
                spacingToggle.checked
            );
        }

        // ========================================
        // UI Updates
        // ========================================

        function refreshValues() {

            sizeValue.textContent =
                sizeSlider.value;

            opacityValue.textContent =
                `${Math.round(
                    Number(opacitySlider.value) * 100
                )}%`;

            flowValue.textContent =
                `${Math.round(
                    Number(flowSlider.value) * 100
                )}%`;

            spacingValue.textContent =
                spacingSlider.value;

            roundnessValue.textContent =
                roundnessSlider.value;

            angleValue.textContent =
                angleSlider.value;
        }

        // ========================================
        // Events
        // ========================================

        clearBtn.addEventListener(
            'click',
            () => {
                painter.clear();

                status.textContent =
                    'Canvas Cleared';
            }
        );

        undoBtn.addEventListener(
            'click',
            () => {
                painter.undo();

                status.textContent =
                    'Undo';
            }
        );

        redoBtn.addEventListener(
            'click',
            () => {
                painter.redo();

                status.textContent =
                    'Redo';
            }
        );

        [
            colorPicker,
            sizeSlider,
            opacitySlider,
            flowSlider,
            spacingSlider,
            roundnessSlider,
            angleSlider,
            smoothToggle,
            spacingToggle
        ].forEach(el => {

            el.addEventListener(
                'input',
                () => {

                    updateConfig();

                    refreshValues();

                    status.textContent =
                        'Brush Updated';
                }
            );
        });

        // ========================================
        // Init
        // ========================================

        refreshValues();
        updateConfig();

        console.log(
            'Fuderu New Brush Engine Ready'
        );

    </script>

</body>

</html>
