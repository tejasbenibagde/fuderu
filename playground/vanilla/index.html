<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuderu Vanilla Playground</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="/fuderu.webp" alt="Fuderu" />
        </div>

        <section class="panel">
          <div class="panel-heading">
            <h2>Active Tool</h2>
            <span id="activeToolName">Brush</span>
          </div>
          <div class="tool-grid">
            <button
              type="button"
              class="tool-btn active"
              data-tool="brush"
              title="Brush (B)"
            >
              🖌️ Brush
            </button>
            <button
              type="button"
              class="tool-btn"
              data-tool="eraser"
              title="Eraser (E)"
            >
              🧹 Eraser
            </button>
            <button
              type="button"
              class="tool-btn"
              data-tool="bucket"
              title="Bucket Fill (F)"
            >
              🪣 Bucket
            </button>
            <button
              type="button"
              class="tool-btn"
              data-tool="rectangle"
              title="Rectangle (R)"
            >
              🔲 Rect
            </button>
            <button
              type="button"
              class="tool-btn"
              data-tool="ellipse"
              title="Ellipse (C)"
            >
              ⭕ Ellipse
            </button>
            <button
              type="button"
              class="tool-btn"
              data-tool="line"
              title="Line (L)"
            >
              📏 Line
            </button>
            <button
              type="button"
              class="tool-btn"
              data-tool="text"
              title="Text (T)"
            >
              🔤 Text
            </button>
            <button
              type="button"
              class="tool-btn"
              data-tool="eyedropper"
              title="Eyedropper (I)"
            >
              💧 Color
            </button>
          </div>
        </section>

        <section class="panel" id="toolOptionsPanel">
          <h2>Tool Settings</h2>

          <div class="tool-options-group" id="brushOptions">
            <label class="field">
              <span>Color</span>
              <input id="colorPicker" type="color" value="#111111" />
            </label>

            <label class="field">
              <span>Size <output id="sizeValue">25px</output></span>
              <input
                id="sizeSlider"
                type="range"
                min="1"
                max="140"
                value="25"
              />
            </label>

            <label class="field">
              <span>Opacity <output id="opacityValue">100%</output></span>
              <input
                id="opacitySlider"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1"
              />
            </label>

            <label class="field">
              <span>Flow <output id="flowValue">60%</output></span>
              <input
                id="flowSlider"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.6"
              />
            </label>

            <label class="field">
              <span>Spacing <output id="spacingValue">0.08</output></span>
              <input
                id="spacingSlider"
                type="range"
                min="0.01"
                max="1"
                step="0.01"
                value="0.08"
              />
            </label>

            <label class="field">
              <span>Roundness <output id="roundnessValue">1.00</output></span>
              <input
                id="roundnessSlider"
                type="range"
                min="0.05"
                max="1"
                step="0.01"
                value="1"
              />
            </label>
          </div>

          <div
            class="tool-options-group"
            id="bucketOptions"
            style="display: none"
          >
            <label class="field">
              <span>Tolerance <output id="toleranceValue">15</output></span>
              <input
                id="toleranceSlider"
                type="range"
                min="0"
                max="100"
                value="15"
              />
            </label>
            <button
              id="fillActiveLayerBtn"
              type="button"
              style="width: 100%; margin-top: 6px"
            >
              Fill Entire Layer
            </button>
          </div>

          <div
            class="tool-options-group"
            id="shapeOptions"
            style="display: none"
          >
            <div class="switch-row">
              <span>Fill Shape</span>
              <input id="shapeFillToggle" type="checkbox" checked />
            </div>
            <div class="switch-row">
              <span>Stroke Outline</span>
              <input id="shapeStrokeToggle" type="checkbox" checked />
            </div>
            <label class="field">
              <span
                >Stroke Width <output id="strokeWidthValue">4px</output></span
              >
              <input
                id="strokeWidthSlider"
                type="range"
                min="1"
                max="50"
                value="4"
              />
            </label>
            <label class="field" id="cornerRadiusField">
              <span
                >Corner Radius <output id="cornerRadiusValue">0px</output></span
              >
              <input
                id="cornerRadiusSlider"
                type="range"
                min="0"
                max="50"
                value="0"
              />
            </label>
          </div>

          <div
            class="tool-options-group"
            id="textOptions"
            style="display: none"
          >
            <label class="field">
              <span>Text</span>
              <input id="textInput" type="text" value="Fuderu Canvas" />
            </label>
            <label class="field">
              <span>Font Size <output id="fontSizeValue">48px</output></span>
              <input
                id="fontSizeSlider"
                type="range"
                min="12"
                max="140"
                value="48"
              />
            </label>
            <label class="field">
              <span>Font Family</span>
              <select id="fontFamilySelect">
                <option value="sans-serif">Sans-Serif</option>
                <option value="serif">Serif</option>
                <option value="monospace">Monospace</option>
                <option value="cursive">Cursive</option>
              </select>
            </label>
            <div class="switch-row">
              <span>Bold</span>
              <input id="textBoldToggle" type="checkbox" />
            </div>
          </div>

          <div
            class="tool-options-group"
            id="eyedropperOptions"
            style="display: none"
          >
            <p
              style="font-size: 11.5px; color: var(--ink-dim); margin: 0 0 8px"
            >
              Click anywhere on canvas to sample color.
            </p>
            <div style="display: flex; align-items: center; gap: 8px">
              <div
                id="sampledColorSwatch"
                style="
                  width: 24px;
                  height: 24px;
                  border-radius: 4px;
                  border: 1px solid var(--line);
                  background: #111111;
                "
              ></div>
              <span
                id="sampledColorLabel"
                style="font-size: 12px; font-variant-numeric: tabular-nums"
                >#111111</span
              >
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>Stroke Input</h2>
          <label class="switch-row">
            <span>Smooth</span>
            <input id="smoothToggle" type="checkbox" checked />
          </label>
          <label class="switch-row">
            <span>Spacing</span>
            <input id="spacingToggle" type="checkbox" checked />
          </label>
          <label class="switch-row">
            <span>Pressure simulation</span>
            <input id="pressureToggle" type="checkbox" />
          </label>
          <label class="switch-row">
            <span>Eraser</span>
            <input id="eraserToggle" type="checkbox" />
          </label>
        </section>

        <section class="panel">
          <h2>Rotation</h2>
          <label class="field">
            <span>Mode</span>
            <select id="rotationMode">
              <option value="fixed">Fixed</option>
              <option value="flow">Flow</option>
              <option value="random">Random</option>
            </select>
          </label>
          <label class="field">
            <span>Angle <output id="angleValue">0deg</output></span>
            <input id="angleSlider" type="range" min="0" max="360" value="0" />
          </label>
          <label class="field">
            <span>Jitter <output id="rotationJitterValue">0deg</output></span>
            <input
              id="rotationJitter"
              type="range"
              min="0"
              max="180"
              value="0"
            />
          </label>
        </section>

        <section class="panel">
          <h2>Modules</h2>
          <label class="field">
            <span>Size jitter <output id="sizeJitterValue">0.00</output></span>
            <input
              id="sizeJitter"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
          </label>
          <label class="field">
            <span>Flow jitter <output id="flowJitterValue">0.00</output></span>
            <input
              id="flowJitter"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
          </label>
          <label class="field">
            <span>Spread <output id="spreadValue">0.00</output></span>
            <input
              id="spreadSlider"
              type="range"
              min="0"
              max="2"
              step="0.01"
              value="0"
            />
          </label>
        </section>

        <section class="panel">
          <h2>Document</h2>
          <div class="preset-grid">
            <button type="button" data-size="800x600">800 x 600</button>
            <button type="button" data-size="1280x720">1280 x 720</button>
            <button type="button" data-size="1920x1080">1920 x 1080</button>
            <button type="button" data-size="1080x1080">Square</button>
          </div>
          <div class="number-row">
            <input id="docWidth" type="number" min="1" value="1920" />
            <input id="docHeight" type="number" min="1" value="1080" />
            <button id="applySizeBtn" type="button">Apply</button>
          </div>
        </section>

        <section class="panel">
          <h2>Persistence (v1.3.0)</h2>
          <div class="preset-grid">
            <button id="exportDocBtn" type="button">Export JSON</button>
            <button id="importDocBtn" type="button">Import JSON</button>
          </div>
          <input
            id="docFileInput"
            type="file"
            accept=".json,application/json"
            style="display: none"
          />
          <div class="preset-grid">
            <button id="exportPngBtn" type="button">Export PNG</button>
            <button id="saveLocalBtn" type="button">Save Local</button>
          </div>
          <button
            id="loadLocalBtn"
            type="button"
            style="width: 100%; margin-top: 6px"
          >
            Load Local Storage
          </button>
        </section>

        <section class="panel">
          <h2>Image Brush</h2>
          <input id="imageInput" type="file" accept="image/*" />
          <button id="removeImageBtn" type="button">Remove Image</button>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <strong id="documentLabel">1920 x 1080</strong>
            <span id="cursorLabel">x 0, y 0</span>
            <span id="status" class="status-badge">Ready</span>
          </div>
          <div class="actions">
            <button id="undoBtn" type="button" title="Undo (Ctrl+Z)">
              Undo
            </button>
            <button id="redoBtn" type="button" title="Redo (Ctrl+Y)">
              Redo
            </button>
            <button id="clearBtn" type="button" class="danger">
              Clear Layer
            </button>
          </div>
        </header>

        <div class="canvas-stage">
          <canvas id="canvas"></canvas>
          <canvas id="overlayCanvas"></canvas>
        </div>
      </main>

      <aside class="layer-sidebar">
        <div class="layer-panel-head">
          <div>
            <h2>Layers</h2>
            <span id="layerCount">1 layer</span>
          </div>
          <button id="addLayerBtn" type="button">Add</button>
        </div>
        <div id="layerList" class="layer-list"></div>
      </aside>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
